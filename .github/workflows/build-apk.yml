name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --platforms=android --org bw.kyro --project-name confidence_lab
          rm -f test/widget_test.dart
          sed -i 's/android:label="confidence_lab"/android:label="Confidence Lab"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ConfidenceLab.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Confidence Lab v0.2.${{ github.run_number }}
          body: |
            Download ConfidenceLab.apk on your Android phone and open it to install.
            You may need to allow "Install unknown apps" for your browser the first time.
          files: ConfidenceLab.apk
          make_latest: true